body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(26,7,5,.82),rgba(26,7,5,.93));z-index:-1}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding:8px 18px;background:rgba(26,7,5,.88);backdrop-filter:blur(10px);border-bottom:1px solid #ff5a1f55}
header img{height:56px;filter:drop-shadow(0 0 10px #ff5a1f)}header b{font-size:22px;letter-spacing:.5px}
nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 18px;color:#fff;background:linear-gradient(135deg,var(--ac),#e61e00);font-weight:700;transition:.2s;box-shadow:0 4px 18px #ff5a1f55}
button:hover{transform:translateY(-2px) scale(1.03)}button.g{background:#ffffff18;box-shadow:none}button.s{padding:6px 12px;font-size:15px}
.hero{text-align:center;padding:60px 18px 40px}.hero img{width:min(300px,70vw);animation:fl 4s ease-in-out infinite;filter:drop-shadow(0 0 30px #ff5a1faa)}
@keyframes fl{50%{transform:translateY(-14px) rotate(-3deg)}}
.hero h1{font-size:clamp(34px,7vw,64px);margin:10px 0;background:linear-gradient(90deg,var(--ac2),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mu);font-size:22px;margin:0 0 20px}
section{max-width:1150px;margin:0 auto;padding:30px 18px}h2{font-size:34px;margin:0 0 18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tabs button{background:#ffffff14;box-shadow:none;font-size:19px}.tabs button.on{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#2a0f0b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{background:var(--card);border:1px solid #ff5a1f33;border-radius:22px;overflow:hidden;transition:.3s;cursor:pointer;position:relative}
.card:hover{transform:translateY(-8px);box-shadow:0 14px 40px #ff5a1f66;border-color:var(--ac)}
.ph{aspect-ratio:16/9;display:grid;place-items:center;font-size:72px;background:linear-gradient(135deg,#ff8a00,#c1180a);overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;transition:.5s}.card:hover .ph img,.card:hover .ph span{transform:scale(1.15)}.ph span{transition:.5s}
.ph:after{content:attr(data-n);position:absolute;inset:0;display:grid;place-items:center;background:rgba(26,7,5,.7);font-size:22px;font-weight:800;opacity:0;transition:.3s;text-align:center;padding:10px}
.card:hover .ph:after{opacity:1}
.card .in{padding:14px 16px}.card h3{margin:0 0 4px;font-size:21px}.card p{margin:0;color:var(--mu);font-size:16px}.pr{color:var(--ac2);font-weight:800;font-size:22px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:50;padding:14px;overflow:auto}.modal.on{display:flex}
.box{background:var(--card);border:1px solid var(--ac);border-radius:26px;width:min(620px,100%);max-height:94vh;overflow:auto;padding:0 0 20px;animation:pop .25s}
@keyframes pop{from{transform:scale(.9);opacity:0}}.box .in{padding:18px 24px}.box h3{font-size:28px;margin:0 0 6px}
.q{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.q button{width:52px;height:52px;padding:0;font-size:22px;background:#ffffff18;box-shadow:none}.q button.on{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#2a0f0b}
.tot{font-size:30px;font-weight:800;color:var(--ac2);margin:10px 0}
input,textarea,select{width:100%;font:inherit;padding:13px 14px;margin:6px 0;border-radius:12px;border:1px solid #ff5a1f66;background:#150503;color:var(--tx)}
label{color:var(--mu);font-size:15px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ord{background:var(--card);border:1px solid #ff5a1f44;border-radius:18px;padding:16px;margin-bottom:14px}
.steps{display:flex;gap:6px;margin:12px 0}.steps div{flex:1;text-align:center;font-size:14px;padding:8px 2px;border-radius:10px;background:#ffffff12;color:var(--mu)}.steps .on{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#2a0f0b;font-weight:800}
.star{font-size:34px;cursor:pointer;color:#555;user-select:none}.star.on{color:var(--ac2)}
.badge{display:inline-block;background:var(--ac);border-radius:20px;padding:0 9px;font-size:14px;margin-left:4px}
.hide{display:none!important}footer{text-align:center;color:var(--mu);padding:30px}
.adm table{width:100%;border-collapse:collapse}.adm td,.adm th{padding:8px;border-bottom:1px solid #ff5a1f33;text-align:left;font-size:16px;vertical-align:top}
.note{background:#ffb40022;border:1px solid var(--ac2);border-radius:12px;padding:10px 14px;font-size:15px;color:var(--ac2);margin-bottom:14px}
@media(max-width:700px){body{font-size:17px}header b{display:none}}

<script>
const $=s=>document.querySelector(s),money=n=>n.toLocaleString('ru-RU')+' сум';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS={pizza:'🍕 Пицца',sushi:'🍣 Суши',lavash:'🌯 Лаваш',chicken:'🍗 Курица',kefsi:'🍛 Кефси'};
const DEF=[

['p2','pizza','🧀','Четыре сыра','Моцарелла, чеддер, дорблю, пармезан','30 см',62000],

['s2','sushi','🍱','Калифорния','Краб, авокадо, икра масаго, 8 шт','8 шт',52000],
['s3','sushi','🍙','Сет «Дракон»','24 шт — для компании','24 шт',139000],
['l1','lavash','🌯','Лаваш с мясом','Говядина, овощи, фирменный соус','большой',32000],
['l2','lavash','🌯','Лаваш с курицей','Курица гриль, сыр, свежие овощи','большой',29000],
['l3','lavash','🌯','Лаваш XXL','Двойная порция мяса и сыра','XXL',42000],
['c1','chicken','🍗','Курица гриль','Целая курица, специи, золотистая корочка','1 шт',75000],
['c2','chicken','🍗','Крылышки BBQ','12 острых крылышек в соусе','12 шт',45000],
['k1','kefsi','🍛','Кефси с мясом','Бухарский плов-кефси с бараниной','порция',38000],
['k2','kefsi','🍛','Кефси с курицей','Нежный рис, курица, морковь','порция',32000]
].map(a=>({id:a[0],cat:a[1],emoji:a[2],name:a[3],desc:a[4],size:a[5],price:a[6]}));
const NEWS0=[
{id:'n1',emoji:'🔥',title:'−20% на пиццу по вторникам',text:'Каждый вторник скидка 20% на все пиццы 30 см. Сегодня тот самый день!'},
{id:'n2',emoji:'🍣',title:'Новые суши-сеты',text:'Сет «Дракон» на 24 штуки уже в меню. Идеально для компании.'},
{id:'n3',emoji:'🛵',title:'Бесплатная доставка',text:'При заказе от 150 000 сум доставка по Бухаре бесплатная.'}];

/* ---------- хранилище: общая БД (если доступна) или localStorage ---------- */
let DB=null;const L={orders:[],menu:[],news:[]},subs=[];
const ls={get:k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function loadLocal(){['orders','menu','news'].forEach(c=>L[c]=ls.get('dhn_'+c)||[]);}
async function put(c,o){if(DB)try{await DB.collection(c).doc(o.id).set(o);return}catch(e){}
 L[c]=L[c].filter(x=>x.id!==o.id).concat(o);ls.set('dhn_'+c,L[c]);render();}
async function del(c,id){if(DB)try{await DB.collection(c).doc(id).delete();return}catch(e){}
 L[c]=L[c].filter(x=>x.id!==id);ls.set('dhn_'+c,L[c]);render();}
function listen(){['orders','menu','news'].forEach(c=>{try{DB.collection(c).onSnapshot(s=>{L[c]=s.docs.map(d=>d.data());render()},()=>{})}catch(e){}})}
window.addEventListener('storage',()=>{if(!DB){loadLocal();render()}});
loadLocal();
if(window.claude&&claude.use)claude.use('db').then(d=>{if(d){DB=d;listen();}}).catch(()=>{});

/* ---------- состояние ---------- */
let cat='pizza',cart=ls.get('dhn_cart')||[],view='home',adminOk=false,atab='orders',pick=null,qty=2;
const mine=()=>ls.get('dhn_mine')||[];
const menu=()=>DEF.concat(L.menu),news=()=>L.news.concat(NEWS0);
const ST=['Оформлен','Готовится','В пути','Доставлен'];
function go(id){show('home');setTimeout(()=>document.getElementById(id).scrollIntoView(),30)}
function show(v){view=v;document.getElementById('m1').classList.remove('on');
 if(v==='home'){$('#site').classList.remove('hide');$('#adm').classList.add('hide');}
 else if(v==='admin'){$('#site').classList.add('hide');$('#adm').classList.remove('hide');}
 else{$('#m2').classList.add('on');}
 render();}
function closeM(i){$('#m'+i).classList.remove('on');if(view!=='admin'&&view!=='home')view='home'}
function photo(it){return it.photo?`<img src="${it.photo}" alt="">`:`<span>${it.emoji||'🍽️'}</span>`}

/* ---------- рендер сайта ---------- */
function render(){
 $('#cc').textContent=cart.reduce((a,c)=>a+c.qty,0);
 $('#tabs').innerHTML=Object.entries(CATS).map(([k,v])=>`<button class="${k===cat?'on':''}" onclick="cat='${k}';render()">${v}</button>`).join('');
 $('#mg').innerHTML=menu().filter(i=>i.cat===cat).map(i=>`<div class="card" onclick="openItem('${i.id}')"><div class="ph" data-n="Нажмите, чтобы выбрать порции">${photo(i)}</div><div class="in"><h3>${esc(i.name)}</h3><p>${esc(i.desc)}</p><div class="row"><div class="pr">${money(+i.price)}</div><span style="color:var(--mu)">${esc(i.size)}</span></div></div></div>`).join('');
 $('#ng').innerHTML=news().map(n=>`<div class="card"><div class="ph" data-n="${esc(n.title)}">${photo(n)}</div><div class="in"><h3>${esc(n.title)}</h3><p>${esc(n.text)}</p></div></div>`).join('');
 if(view==='cart')cartView();if(view==='my')myView();if(view==='admin')admView();
}
function openItem(id){pick=menu().find(i=>i.id===id);qty=2;itemView();$('#m1').classList.add('on')}
function itemView(){const i=pick;$('#b1').innerHTML=`<div class="ph" style="border-radius:0">${photo(i)}</div><div class="in"><h3>${esc(i.name)}</h3><p style="color:var(--mu)">${esc(i.desc)} · ${esc(i.size)}</p><label>Сколько порций?</label><div class="q">${[1,2,3,4,5,6,7].map(n=>`<button class="${n===qty?'on':''}" onclick="qty=${n};itemView()">${n}</button>`).join('')}</div><div class="tot">${qty} × ${money(+i.price)} = ${money(qty*i.price)}</div><div class="row"><button class="g" onclick="closeM(1)">Закрыть</button><button onclick="addCart()">Заказать 🛒</button></div></div>`}
function addCart(){const e=cart.find(c=>c.id===pick.id);e?e.qty=Math.min(20,e.qty+qty):cart.push({id:pick.id,name:pick.name,price:+pick.price,qty});ls.set('dhn_cart',cart);closeM(1);show('cart')}
const total=()=>cart.reduce((a,c)=>a+c.qty*c.price,0);
function cartView(){
 if(!cart.length){$('#b2').innerHTML=`<div class="in"><h3>🛒 Корзина</h3><p>Корзина пуста.</p><button onclick="closeM(2)">К меню</button></div>`;return}
 $('#b2').innerHTML=`<div class="in"><h3>🛒 Корзина</h3>${cart.map((c,x)=>`<div class="row" style="border-bottom:1px solid #ff5a1f33;padding:8px 0"><div>${esc(c.name)}<br><small style="color:var(--mu)">${money(c.price)}</small></div><div><button class="s g" onclick="chg(${x},-1)">−</button> <b>${c.qty}</b> <button class="s g" onclick="chg(${x},1)">+</button></div></div>`).join('')}
 <div class="tot">Итого: ${money(total())}</div>
 <h3 style="font-size:22px">Оформление</h3>
 <input id="fn" placeholder="Ваше имя"><input id="fp" type="tel" placeholder="Номер телефона, +998…"><textarea id="fa" rows="2" placeholder="Адрес доставки"></textarea>
 <div class="row"><input id="fm" placeholder="Ссылка на карту / координаты" style="flex:1"><button class="g s" onclick="geo()">📍 Моя позиция</button></div>
 <div id="fe" style="color:#ff8a6a"></div><div class="row" style="margin-top:12px"><button class="g" onclick="closeM(2)">Закрыть</button><button onclick="send()">Оформить заказ</button></div></div>`}
function chg(x,d){cart[x].qty+=d;if(cart[x].qty<1)cart.splice(x,1);ls.set('dhn_cart',cart);render()}
function geo(){navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{$('#fm').value=`https://maps.google.com/?q=${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)}`},()=>{$('#fe').textContent='Не удалось определить позицию — вставьте ссылку вручную.'}):0}
async function send(){
 const o={id:'o'+Date.now(),name:$('#fn').value.trim(),phone:$('#fp').value.trim(),address:$('#fa').value.trim(),map:$('#fm').value.trim(),items:cart.map(c=>({...c})),total:total(),status:0,rating:0,comment:'',created:Date.now()};
 if(!o.name||o.phone.replace(/\D/g,'').length<9||!o.address){$('#fe').textContent='Заполните имя, телефон и адрес.';return}
 await put('orders',o);const m=mine();m.push(o.id);ls.set('dhn_mine',m);cart=[];ls.set('dhn_cart',cart);
 const body=`Новый заказ ${o.id}\nИмя: ${o.name}\nТел: ${o.phone}\nАдрес: ${o.address}\nКарта: ${o.map}\n`+o.items.map(i=>`${i.name} x${i.qty}`).join('\n')+`\nИтого: ${money(o.total)}`;
 $('#b2').innerHTML=`<div class="in" style="text-align:center"><div style="font-size:70px">✅</div><h3>Заказ оформлен!</h3><p style="color:var(--mu)">Мы получили ваш заказ. Следите за статусом в «Мои заказы».</p><a class="btn" style="display:inline-block;text-decoration:none;margin:6px" href="mailto:dhnpizzabukhara@gmail.com?subject=${encodeURIComponent('Заказ '+o.id)}&body=${encodeURIComponent(body)}">✉️ Продублировать на почту</a><br><button style="margin:6px" onclick="show('my')">Мои заказы</button></div>`}
function myView(){
 const ids=mine(),os=L.orders.filter(o=>ids.includes(o.id)).sort((a,b)=>b.created-a.created);
 $('#b2').innerHTML=`<div class="in"><h3>📦 Мои заказы</h3>${os.length?os.map(o=>`<div class="ord"><div class="row"><b>${new Date(o.created).toLocaleString('ru-RU')}</b><b style="color:var(--ac2)">${money(o.total)}</b></div><div style="color:var(--mu)">${o.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</div><div class="steps">${ST.map((s,k)=>`<div class="${k<=o.status?'on':''}">${s}</div>`).join('')}</div>${o.status===3?(o.rating?`<div>Ваша оценка: ${'★'.repeat(o.rating)}${'☆'.repeat(5-o.rating)}</div>`:`<div>Оцените заказ:<br>${[1,2,3,4,5].map(n=>`<span class="star" onclick="rate('${o.id}',${n})">★</span>`).join('')}</div>`):''}</div>`).join(''):'<p>Пока нет заказов.</p>'}<button class="g" onclick="closeM(2)">Закрыть</button></div>`}
async function rate(id,n){const o=L.orders.find(x=>x.id===id);if(o)await put('orders',{...o,rating:n})}

/* ---------- админка (#admin) ---------- */
const PASS='dhnpizza26';
function admView(){
 if(!adminOk){$('#adm').innerHTML=`<section style="max-width:420px;text-align:center"><h2>🔐 Админ-панель</h2><input id="ap" type="password" placeholder="Пароль" onkeydown="if(event.key==='Enter')login()"><div id="ae" style="color:#ff8a6a"></div><button onclick="login()">Войти</button> <button class="g" onclick="location.hash='';">На сайт</button></section>`;return}
 const T={orders:'Заказы',make:'Оформить заказ',items:'Меню',news:'Новости'};
 $('#adm').innerHTML=`<section><div class="row"><h2>Админка</h2><div class="tabs">${Object.entries(T).map(([k,v])=>`<button class="${k===atab?'on':''}" onclick="atab='${k}';render()">${v}</button>`).join('')}<button class="g" onclick="adminOk=false;location.hash=''">Выйти</button></div></div><div id="ab"></div></section>`;
 const f={orders:aOrders,make:aMake,items:aItems,news:aNews}[atab];f();}
function login(){if($('#ap').value===PASS){adminOk=true;render()}else $('#ae').textContent='Неверный пароль'}
function aOrders(){const os=[...L.orders].sort((a,b)=>b.created-a.created);
 $('#ab').innerHTML=(DB?'':'<div class="note">Режим без общей базы: заказы видны только в этом браузере.</div>')+(os.length?os.map(o=>`<div class="ord"><div class="row"><b>${esc(o.name)} · <a style="color:var(--ac2)" href="tel:${esc(o.phone)}">${esc(o.phone)}</a></b><span>${new Date(o.created).toLocaleString('ru-RU')}</span></div><div>📍 ${esc(o.address)} ${o.map?`<a style="color:var(--ac2)" target="_blank" href="${esc(o.map)}">карта</a>`:''}</div><div style="color:var(--mu)">${o.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')} — <b>${money(o.total)}</b></div><div class="steps">${ST.map((s,k)=>`<div class="${k===o.status?'on':''}" style="cursor:pointer" onclick="setSt('${o.id}',${k})">${s}</div>`).join('')}</div>${o.rating?`<div>Оценка клиента: <span style="color:var(--ac2)">${'★'.repeat(o.rating)}</span>${'☆'.repeat(5-o.rating)}</div>`:''}<button class="s g" onclick="del('orders','${o.id}')">Удалить</button></div>`).join(''):'<p>Заказов пока нет.</p>')}
async function setSt(id,k){const o=L.orders.find(x=>x.id===id);await put('orders',{...o,status:k})}
let ac=[];
function aMake(){ac=[];$('#ab').innerHTML=`<div class="ord"><input id="mn" placeholder="Имя клиента"><input id="mp" placeholder="Телефон"><input id="ma" placeholder="Адрес"><label>Блюда</label>${menu().map((i,x)=>`<div class="row"><span>${esc(i.name)} <small>${money(+i.price)}</small></span><input type="number" min="0" max="20" value="0" style="width:80px" data-i="${i.id}"></div>`).join('')}<br><button onclick="mk()">Оформить</button></div>`}
async function mk(){const it=[...document.querySelectorAll('[data-i]')].map(e=>{const m=menu().find(i=>i.id===e.dataset.i);return{id:m.id,name:m.name,price:+m.price,qty:+e.value}}).filter(i=>i.qty>0);
 if(!it.length||!$('#mn').value)return alert('Укажите имя и блюда');
 await put('orders',{id:'o'+Date.now(),name:$('#mn').value,phone:$('#mp').value,address:$('#ma').value,map:'',items:it,total:it.reduce((a,c)=>a+c.price*c.qty,0),status:0,rating:0,comment:'',created:Date.now()});atab='orders';render()}
function img(inp,cb){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=640;c.height=360;const x=c.getContext('2d'),s=Math.max(640/im.width,360/im.height);x.drawImage(im,(640-im.width*s)/2,(360-im.height*s)/2,im.width*s,im.height*s);cb(c.toDataURL('image/jpeg',.7))};im.src=r.result};r.readAsDataURL(f)}
let ph='';
function aItems(){ph='';$('#ab').innerHTML=`<div class="ord"><h3 style="margin:0 0 8px">Добавить позицию</h3><input id="in" placeholder="Название"><textarea id="id" rows="2" placeholder="Описание"></textarea><div class="row"><input id="is" placeholder="Размер: 30 см / большой лаваш" style="flex:1"><input id="ip" type="number" placeholder="Цена, сум" style="flex:1"></div><select id="ic">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><label>Фото (16:9)</label><input type="file" accept="image/*" onchange="img(this,d=>ph=d)"><button onclick="addIt()">Добавить</button></div><div class="ord"><h3 style="margin:0 0 8px">Добавленные вами</h3>${L.menu.map(i=>`<div class="row"><span>${esc(i.name)} — ${money(+i.price)}</span><button class="s g" onclick="del('menu','${i.id}')">Удалить</button></div>`).join('')||'<small>Пока пусто</small>'}</div>`}
async function addIt(){if(!$('#in').value||!$('#ip').value)return alert('Название и цена обязательны');await put('menu',{id:'m'+Date.now(),cat:$('#ic').value,emoji:'🍽️',name:$('#in').value,desc:$('#id').value,size:$('#is').value,price:+$('#ip').value,photo:ph});atab='items';render()}
function aNews(){ph='';$('#ab').innerHTML=`<div class="ord"><input id="nt" placeholder="Заголовок"><textarea id="nx" rows="3" placeholder="Текст"></textarea><label>Фото 16:9</label><input type="file" accept="image/*" onchange="img(this,d=>ph=d)"><button onclick="addN()">Опубликовать</button></div><div class="ord">${L.news.map(n=>`<div class="row"><span>${esc(n.title)}</span><button class="s g" onclick="del('news','${n.id}')">Удалить</button></div>`).join('')||'<small>Добавленных новостей нет</small>'}</div>`}
async function addN(){if(!$('#nt').value)return;await put('news',{id:'n'+Date.now(),emoji:'📰',title:$('#nt').value,text:$('#nx').value,photo:ph});render()}

function route(){if(location.hash==='#admin')show('admin');else if(view==='admin')show('home')}
addEventListener('hashchange',route);['m1','m2'].forEach((m,i)=>$('#'+m).addEventListener('click',e=>{if(e.target.id===m)closeM(i+1)}));
route();render();
</script></body></html>
